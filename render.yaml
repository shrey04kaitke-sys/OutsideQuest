services:
  - type: web
    name: outsidequest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OUTSIDEQUEST_PUBLIC_MODE
        value: "true"
